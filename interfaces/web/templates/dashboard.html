<!DOCTYPE html>
<html>

<head>

<title>CYN-X Dashboard</title>


<link 
rel="stylesheet"
href="/static/style.css">


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>


<body>


<div class="container py-4">



<h1>
💜 CYN-X Developer Dashboard
</h1>





<!-- TOOLBAR -->


<div class="card mt-4">


<div class="card-header">

[CYN-X BENCHMARK CONTROL]

</div>


<div class="card-body">


<div class="row g-2">


<div class="col-md-3">


<select 
id="benchmarkType"
class="form-select">


<option value="all">

All Tests

</option>


<option value="personality">

Personality

</option>


<option value="emotion">

Emotion

</option>


<option value="memory">

Memory

</option>


<option value="performance">

Performance

</option>


</select>


</div>




<div class="col-md-auto">


<button
id="benchmarkButton"
class="btn btn-primary">


🧪 Run Benchmark


</button>


</div>




<div class="col-md-auto">


<button
id="clearLogs"
class="btn btn-danger">


🗑 Clear Logs


</button>


</div>



<div class="col-md-auto">


<button
id="exportResults"
class="btn btn-success">


💾 Export


</button>


</div>



</div>



<div id="benchmarkStatus"
class="mt-3">


Waiting...


</div>



</div>


</div>







<!-- LOG -->


<div class="card mt-4">


<div class="card-header">

[SYSTEM LOG]

</div>


<div 
id="benchmarkLogs"
class="card-body log-window">


CYN-X Console Ready...


</div>


</div>








<!-- GRAPHS -->


<div class="card mt-4">


<div class="card-header">

[TRAINING METRICS]

</div>


<div class="card-body">


<canvas id="performanceGraph"></canvas>


<canvas id="personalityGraph"></canvas>


</div>


</div>





</div>



<script src="/static/dashboard.js"></script>


</body>

</html>
