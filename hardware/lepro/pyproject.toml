[project]
name = "lepro-local"
version = "0.1.0"
description = "Tools and notes for running Lepro WiFi/BLE devices locally (BLE control, optional local MQTT)"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
    "bumble>=0.0.229",
    "cryptography>=48.0.0",
    "esptool>=4.7",
    "pycryptodome>=3.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[project.scripts]
lepro-bond = "lepro.cli.bond:main"
lepro-ota = "lepro.cli.ota:main"
lepro-firmware = "lepro.cli.firmware:main"
lepro-provision = "lepro.cli.provision:main"
lepro-status = "lepro.cli.status:main"
lepro-ctl = "lepro.cli.ctl:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lepro"]
